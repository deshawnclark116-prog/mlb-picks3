name: NBA V3 latest run (re-simulate with current injuries)

# The original first-seen forecast (docs/nba_v3_phase1_corrected_shadow) is the graded record and is never touched.
# This job re-runs the same model closer to tip-off with the current injury list and publishes ONE replaceable file,
# docs/nba_v3_latest/latest.json, that the app shows when it is newer and passes the same validation.
# The V4 shadow model (nba/nba_v4_forecast.py) runs right after it on the same games and publishes docs/nba_v4_latest/latest.json.
# The V5 whole-game simulation (nba/nba_v5_forecast.py) then publishes docs/nba_v5_latest/latest.json (shadow: the app shows it only when
# docs/nba_v5_latest/screen.json says {"show":true}), freezes each original forecast in docs/nba_v5_archive/first, and logs injury reports.
# A V4 failure never blocks V3. It re-simulates only when the set of OUT players changed (or the file is older than 3h), so commits stay rare.
on:
  schedule:
    # Avoid the busiest top-of-hour scheduler boundary; the lineup poll
    # additionally invokes this workflow through workflow_run on its own ticks.
    - cron: "1,11,21,31,41,51 * * * *"
  workflow_run:
    # Other independently scheduled model-source workflows provide redundant
    # wake-ups when GitHub drops NBA-specific cron ticks. These are only
    # triggers: the NBA source/tipoff decision below still controls simulation.
    workflows:
      - "NBA V5 official daily-lineups pretip poll and change-trigger"
      - "NBA V2 daily first-seen player forecasts"
      - "NBA probability first-observed snapshots and real forward calibration"
      - "NHL verified daily SOG model delivery"
      - "NHL published pregame static fallback sync"
      - "NHL forward calibration of original model shot milestones"
      - "Soccer ESPN automatic pregame player forecasts"
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/nba_v3_latest_refresh.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-simulate even if injuries are unchanged"
        required: false
        default: "false"
      window_hours:
        description: "Look-ahead window in hours (games tipping within this many hours are refreshed)"
        required: false
        default: "9"
permissions:
  contents: write
concurrency:
  group: nba-v3-latest-refresh
  cancel-in-progress: false
jobs:
  latest:
    # Poll-triggered runs must originate from the trusted default branch;
    # never execute write-capable pregame jobs for PR-triggered poll tests.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=2.1,<2.5" "scipy>=1.14,<1.18"
      - uses: actions/cache@v4
        with:
          path: .cache/nba-v3-phase1
          key: nba-v3-prior-espn-${{ github.run_id }}
          restore-keys: |
            nba-v3-prior-espn-
      - name: Upcoming fixtures and current injuries
        id: src
        run: |
          set -euo pipefail
          PYTHONPATH=. python -u nba/nba_rolling_future_fixtures.py --days 2 --out "$RUNNER_TEMP/fixtures.json"
          PYTHONPATH=. python -u nba/nba_live_injury_source.py --out "$RUNNER_TEMP/injuries.json" || echo '{}' > "$RUNNER_TEMP/injuries.json"
          # Poll the NBA's own status PDF on each near-game scheduler tick,
          # BEFORE deciding whether new predictions are necessary. Failure
          # carries forward prior official-status digest, never assumes active.
          python -m pip install -q 'pdfplumber>=0.11,<0.13'
          PYTHONPATH=. python -u -m nba.nba_v5_official_injuries \
            --out "$RUNNER_TEMP/official_probe.json" || echo '{}' > "$RUNNER_TEMP/official_probe.json"
          PYTHONPATH=. python -u -m nba.nba_v5_refresh_decision \
            --fixtures "$RUNNER_TEMP/fixtures.json" \
            --espn "$RUNNER_TEMP/injuries.json" \
            --official "$RUNNER_TEMP/official_probe.json" \
            --state docs/nba_v3_latest/state.json \
            --force "${FORCE:-false}" --window-hours "${WINDOW:-9}"
        env:
          FORCE: ${{ github.event.inputs.force }}
          WINDOW: ${{ github.event.inputs.window_hours }}
      - name: Re-simulate (same model, same checks, empty first-seen archive)
        if: steps.src.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-archive"
          PYTHONPATH=. python -u nba/nba_v3_shadow_publish.py \
            --fixture "$RUNNER_TEMP/fixtures.json" \
            --injury-snapshot "$RUNNER_TEMP/injuries.json" \
            --history-cache .cache/nba-v3-phase1 \
            --archive-root "$RUNNER_TEMP/empty-archive" \
            --draws 8000 --window-hours "${WINDOW:-9}" --out "$RUNNER_TEMP/latest-new.json" \
            --v5-facts-out "$RUNNER_TEMP/v5_game_facts.json"
      - name: NBA V5 official starting-five observation (never confuse projected with confirmed)
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/latest-new.json"
          PYTHONPATH=. python -u -m nba.nba_v5_live_confirmed_lineups \
            --v3 "$RUNNER_TEMP/latest-new.json" \
            --out "$RUNNER_TEMP/v5_official_starters.json" \
            --audit "$RUNNER_TEMP/v5_official_starters_audit.json"
          # If the public NBA feed lacks an explicit pretip five, status remains
          # NOT_POSTED. No guessed player receives the CONFIRMED label.
      - name: NBA V5 official daily-lineups JSON pretip confirmation
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/latest-new.json"
          PYTHONPATH=. python -u -m nba.nba_v5_daily_lineups_feed \
            --v3 "$RUNNER_TEMP/latest-new.json" \
            --out "$RUNNER_TEMP/v5_daily_starters.json" \
            --audit "$RUNNER_TEMP/v5_daily_starters_audit.json"
          # Team is CONFIRMED only when the NBA feed shows a not-started game
          # and five distinct PG/SG/SF/PF/C players with Confirmed+Active.
      - name: NBA Today's Lineups authorized snapshot bridge (no NBA page scraping)
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        env:
          AUTHORIZED_LINEUP_JSON_URL: ${{ secrets.NBA_V5_AUTHORIZED_LINEUP_JSON_URL }}
        run: |
          set -euo pipefail
          if [ -z "$AUTHORIZED_LINEUP_JSON_URL" ]; then
            echo "NBA_TODAY_LINEUPS_NOT_CONFIGURED: authorized data URL missing; existing official collector remains fallback"
            exit 0
          fi
          # This URL must point to a permissioned JSON snapshot exporter, NOT
          # nba.com/players/todays-lineups (a client-rendered HTML web page).
          python - <<'PY'
          import os, urllib.parse, urllib.request
          from pathlib import Path
          url = os.environ["AUTHORIZED_LINEUP_JSON_URL"]
          parsed = urllib.parse.urlsplit(url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise ValueError("NBA_LINEUP_AUTHORIZED_SOURCE_REQUIRES_HTTPS")
          req = urllib.request.Request(url, headers={"Accept":"application/json"})
          with urllib.request.urlopen(req, timeout=12) as response:
              if urllib.parse.urlsplit(response.geturl()).scheme != "https":
                  raise ValueError("NBA_LINEUP_AUTHORIZED_SOURCE_REDIRECT_NOT_HTTPS")
              raw = response.read(2_000_001)
          if len(raw) > 2_000_000:
              raise ValueError("NBA_LINEUP_AUTHORIZED_SOURCE_TOO_LARGE")
          Path(os.environ["RUNNER_TEMP"], "nba_todays_lineups_authorized_capture.json").write_bytes(raw)
          PY
          PYTHONPATH=. python -u -m nba.nba_v5_todays_lineups \
            --v3 "$RUNNER_TEMP/latest-new.json" \
            --snapshot "$RUNNER_TEMP/nba_todays_lineups_authorized_capture.json" \
            --out "$RUNNER_TEMP/v5_today_starters.json" \
            --audit "$RUNNER_TEMP/v5_today_starters_audit.json"
          # A successful parse is not automatically a verified source licence or
          # confirmed lineup. The JSON must carry explicit pretip team confirmations.
      - name: NBA V5 real player-tracking source from free completed-season releases
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/latest-new.json"
          python -m pip install -q 'pandas>=2.2,<3.0' 'pyarrow>=18,<25'
          PYTHONPATH=. python -u -m nba.nba_v5_hoopr_tracking \
            --v3 "$RUNNER_TEMP/latest-new.json" \
            --out "$RUNNER_TEMP/hoopr_tracking.json" \
            --receipt "$RUNNER_TEMP/hoopr_tracking_receipt.json"
          # Real source *quality* can now be attached to each forecast. The
          # candidate role adjustment stays OFF until an untouched trial passes.
      - name: V4 - add finished games to the history
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          PYTHONPATH=. python -u -m nba.nba_v4_dataset --start 2026-10-20 --end "$(TZ=America/New_York date +%F)" \
            --out nba/data/nba_v4_games_2026_27.jsonl --workers 6
      - name: V4 - shadow forecast for the same games
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/latest-new.json"
          mkdir -p docs/nba_v4_latest
          PYTHONPATH=. python -u -m nba.nba_v4_forecast \
            --history nba/data/nba_v4_games_2025_26.jsonl.gz --history nba/data/nba_v4_games_2026_27.jsonl \
            --v3 "$RUNNER_TEMP/latest-new.json" --out docs/nba_v4_latest/latest.json
      - name: V5 - add finished games' play-by-play
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          gunzip -c nba/data/nba_v5_pbp_2026_27.jsonl.gz > "$RUNNER_TEMP/pbp_2026.jsonl"
          PYTHONPATH=. python -u -m nba.nba_v5_pbp --games nba/data/nba_v4_games_2026_27.jsonl --out "$RUNNER_TEMP/pbp_2026.jsonl" --workers 6
          gzip -9 -c "$RUNNER_TEMP/pbp_2026.jsonl" > nba/data/nba_v5_pbp_2026_27.jsonl.gz
      - name: NBA official injury report - source observation (never infer active from absence)
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -f docs/nba_v5_latest/official_report.json docs/nba_v5_latest/official_matches.json
          PYTHONPATH=. python -u -m nba.nba_v5_official_injuries \
            --captured "$RUNNER_TEMP/official_probe.json" \
            --v3 "$RUNNER_TEMP/latest-new.json" \
            --out docs/nba_v5_latest/official_report.json \
            --matches-out docs/nba_v5_latest/official_matches.json
      - name: V5 - whole-game simulation, information receipt, frozen archive
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p docs/nba_v5_latest docs/nba_v5_info
          PYTHONPATH=. python -u -m nba.nba_v5_info --v3 "$RUNNER_TEMP/latest-new.json" \
            --history nba/data/nba_v4_games_2025_26.jsonl.gz --history nba/data/nba_v4_games_2026_27.jsonl \
            --ledger docs/nba_v5_info/ledger.jsonl --out docs/nba_v5_latest/information_receipt.json \
            --official-matches docs/nba_v5_latest/official_matches.json
          CAL=""; test -f docs/nba_v5_latest/calibration.json && CAL="--calibration docs/nba_v5_latest/calibration.json"
          # Prefer the source that verified the most teams. On ties,
          # official NBA daily JSON takes precedence over an authorized
          # snapshot and the older live boxscore source. Never promote
          # zero-confirmation reports to confirmed pregame evidence.
          PYTHONPATH=. python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          sources=[
              ("NBA_OFFICIAL_DAILY_LINEUPS","v5_daily_starters.json","v5_daily_starters_audit.json"),
              ("NBA_TODAYS_LINEUPS_AUTHORIZED_SNAPSHOT","v5_today_starters.json","v5_today_starters_audit.json"),
              ("NBA_OFFICIAL_LIVE_BOXSCORE","v5_official_starters.json","v5_official_starters_audit.json"),
          ]
          rows=[]
          for provider,filename,auditfile in sources:
              doc, audit = root/filename, root/auditfile
              if not doc.is_file() or not audit.is_file():
                  continue
              try:
                  info=json.loads(audit.read_text())
                  count=int(info.get("confirmed_teams",0))
                  if count<0: continue
                  if json.loads(doc.read_text()).get("provider")!=provider: continue
                  rows.append({"provider":provider,"evidence":str(doc),"audit":str(audit),"confirmed_teams":count})
              except (OSError,ValueError,TypeError,KeyError):
                  continue
          selected=max(rows,key=lambda x:x["confirmed_teams"]) if rows else None
          Path(root,"v5_pregame_choice.json").write_text(json.dumps(
              {"selected":selected,"available_sources":rows},sort_keys=True))
          print("NBA_V5_PREGAME_SOURCE_CHOICE",json.dumps(
              {"selected":selected,"available_sources":rows},sort_keys=True))
          PY
          # Every provider contributes its independently verified teams.
          # The Python evidence loader resolves per-team confirmation and
          # rejects disagreeing confirmed fives rather than dropping entire
          # sources because another had more total confirmed teams.
          PREGAME_ARGS=()
          while IFS= read -r filename; do
            if [ -n "$filename" ]; then
              PREGAME_ARGS+=(--pregame-evidence "$filename")
            fi
          done < <(python -c 'import json,sys; d=json.load(open(sys.argv[1])); [print(s["evidence"]) for s in d.get("available_sources",[]) if s.get("evidence")]' "$RUNNER_TEMP/v5_pregame_choice.json")
          SOURCE_AUDIT="$(python -c 'import json,sys; s=json.load(open(sys.argv[1])).get("selected") or {}; print(s.get("audit",""))' "$RUNNER_TEMP/v5_pregame_choice.json")"
          cp "$RUNNER_TEMP/v5_game_facts.json" docs/nba_v5_latest/game_source_facts.json
          cp "$RUNNER_TEMP/v5_pregame_choice.json" docs/nba_v5_latest/lineup_source_choice.json
          if [ -n "$SOURCE_AUDIT" ] && [ -s "$SOURCE_AUDIT" ]; then
            cp "$SOURCE_AUDIT" docs/nba_v5_latest/lineup_source_audit.json
          fi
          TRACKING_SOURCE=""
          if [ -s "$RUNNER_TEMP/hoopr_tracking.json" ]; then
            TRACKING_SOURCE="--licensed-data $RUNNER_TEMP/hoopr_tracking.json"
          fi
          PYTHONPATH=. python -u -m nba.nba_v5_forecast \
            --games nba/data/nba_v4_games_2025_26.jsonl.gz --games nba/data/nba_v4_games_2026_27.jsonl \
            --pbp nba/data/nba_v5_pbp_2025_26.jsonl.gz --pbp "$RUNNER_TEMP/pbp_2026.jsonl" \
            --game-facts "$RUNNER_TEMP/v5_game_facts.json" --out docs/nba_v5_latest/latest.json --sims 10000 $CAL \
            --receipt docs/nba_v5_latest/information_receipt.json --grades docs/nba_v5_grades/summary.json \
            --features docs/nba_v5_latest/features.json \
            --archive docs/nba_v5_archive $TRACKING_SOURCE "${PREGAME_ARGS[@]}"
      - name: Audit V5 latest simulation probabilities, stale data and confirmed absences
        if: steps.src.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          test -s docs/nba_v5_latest/latest.json
          PYTHONPATH=. python -m nba.nba_v5_readiness \
            --forecast docs/nba_v5_latest/latest.json \
            --out docs/nba_v5_latest/readiness.json --strict
      - name: Determine which new games have a frozen champion but no frozen lineup challenger
        if: steps.src.outputs.run == 'true'
        id: challenge
        run: |
          python - <<'PY'
          import json,os,gzip,datetime as dt
          from pathlib import Path
          first=Path("docs/nba_v5_archive/first")
          alternate=Path("docs/nba_v5_lineup_archive/first")
          fresh=Path("docs/nba_v5_latest/latest.json")
          try: games=json.loads(fresh.read_text())["games"]
          except (OSError,ValueError,KeyError): games=[]
          now=dt.datetime.now(dt.timezone.utc)
          def eligible(game):
              gid=str(game["game_id"])
              snap=first/(gid+".json.gz")
              if not snap.exists() or (alternate/(gid+".json.gz")).exists():
                  return False
              try:
                  with gzip.open(snap,"rt") as f:
                      original=json.load(f)["games"][0]
                  created=dt.datetime.fromisoformat(original["forecast_at_utc"].replace("Z","+00:00"))
                  tip=dt.datetime.fromisoformat(original["tipoff_utc"].replace("Z","+00:00"))
                  return 0 <= (now-created).total_seconds() <= 30*60 and (tip-now).total_seconds() >= 15*60
              except (OSError,KeyError,ValueError):
                  return False
          # A previous deployment failed at this exact clock comparison.
          # Keep the check visible so it cannot silently block publication.
          assert isinstance((now-dt.datetime.now(dt.timezone.utc)).total_seconds(),float)
          candidates=[str(g["game_id"]) for g in games if eligible(g)]
          # Keep the experimental V3 slate to exactly new, strictly paired
          # champion first-seen games; never backfill unrelated older games.
          # The challenger must consume NEUTRAL raw game facts, NEVER an
          # already-produced V5 forecast as the next version\'s input.
          facts=Path(os.environ["RUNNER_TEMP"])/"v5_game_facts.json"
          subset=json.loads(facts.read_text()) if candidates else {"games":[]}
          subset["games"]=[g for g in subset.get("games",[])
                           if str(g["game_id"]) in candidates]
          with open(Path(os.environ["RUNNER_TEMP"])/"v5_lineup_games.json","w") as fh:
              json.dump(subset,fh)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("run="+("true" if candidates else "false")+"\n")
          print("CHALLENGER_FROZEN_FIRST_REQUIRED",candidates)
          PY
      - name: V5 - snapshot independent pregame lineup challenger (research only)
        if: steps.challenge.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p docs/nba_v5_lineup_latest
          python - <<'PY'
          import json,os
          src=json.load(open("docs/nba_v5_latest/features.json"))
          src["features"]["lineup_pairs"]=True
          out=os.environ["RUNNER_TEMP"]+"/v5_lineup_features.json"
          json.dump(src,open(out,"w"))
          print("Research challenger lineup_pairs:",src["features"]["lineup_pairs"])
          PY
          PYTHONPATH=. python -u -m nba.nba_v5_forecast \
            --games nba/data/nba_v4_games_2025_26.jsonl.gz --games nba/data/nba_v4_games_2026_27.jsonl \
            --pbp nba/data/nba_v5_pbp_2025_26.jsonl.gz --pbp "$RUNNER_TEMP/pbp_2026.jsonl" \
            --game-facts "$RUNNER_TEMP/v5_lineup_games.json" \
            --out docs/nba_v5_lineup_latest/latest.json --sims 10000 \
            --receipt docs/nba_v5_latest/information_receipt.json \
            --grades docs/nba_v5_grades/summary.json \
            --features "$RUNNER_TEMP/v5_lineup_features.json" \
            --archive docs/nba_v5_lineup_archive
      - name: Publish the replaceable latest file
        if: steps.src.outputs.run == 'true'
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/latest-new.json" || { echo "no forecast produced"; exit 0; }
          mkdir -p docs/nba_v3_latest
          cp "$RUNNER_TEMP/latest-new.json" docs/nba_v3_latest/latest.json
          python - <<'PY'
          import json,os
          d=json.load(open("docs/nba_v3_latest/latest.json"))
          json.dump({"hash":os.environ["H"],"official_signature":os.environ["OFF_SIG"],
                     "generated_at_utc":d["generated_at_utc"],
                     "games":[g["game_id"] for g in d["games"]]},
                    open("docs/nba_v3_latest/state.json","w"),indent=1)
          PY
          git config user.name "nba-v3-latest[bot]"
          git config user.email "nba-v3-latest[bot]@users.noreply.github.com"
          git add -A docs/nba_v3_latest
          git add -A docs/nba_v4_latest nba/data || true
          git add -A docs/nba_v5_latest docs/nba_v5_info docs/nba_v5_archive || true
          git add -A docs/nba_v5_lineup_archive docs/nba_v5_lineup_latest || true
          git status --short | head -10
          git restore --worktree -- . 2>/dev/null || true   # drop any other stray change so the rebase can run
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "NBA V3 latest run + V4 + V5 shadow $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep 5; done
          echo "push failed"; exit 1
        env:
          H: ${{ steps.src.outputs.hash }}
          OFF_SIG: ${{ steps.src.outputs.official_signature }}
