name: NBA V3 latest run (re-simulate with current injuries)

# The original first-seen forecast (docs/nba_v3_phase1_corrected_shadow) is the graded record and is never touched.
# This job re-runs the same model closer to tip-off with the current injury list and publishes ONE replaceable file,
# docs/nba_v3_latest/latest.json, that the app shows when it is newer and passes the same validation.
# It re-simulates only when the set of OUT players changed (or the file is older than 3h), so commits stay rare.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-simulate even if injuries are unchanged"
        required: false
        default: "false"
permissions:
  contents: write
concurrency:
  group: nba-v3-latest-refresh
  cancel-in-progress: false
jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=2.1,<2.5"
      - uses: actions/cache@v4
        with:
          path: .cache/nba-v3-phase1
          key: nba-v3-prior-espn-${{ github.run_id }}
          restore-keys: |
            nba-v3-prior-espn-
      - name: Upcoming fixtures and current injuries
        id: src
        run: |
          set -euo pipefail
          PYTHONPATH=. python -u nba/nba_rolling_future_fixtures.py --days 2 --out "$RUNNER_TEMP/fixtures.json"
          PYTHONPATH=. python -u nba/nba_live_injury_source.py --out "$RUNNER_TEMP/injuries.json" || echo '{}' > "$RUNNER_TEMP/injuries.json"
          python - <<'PY'
          import json,os,hashlib,datetime as dt
          T=os.environ["RUNNER_TEMP"]
          fx=json.load(open(T+"/fixtures.json")); inj=json.load(open(T+"/injuries.json"))
          now=dt.datetime.now(dt.timezone.utc)
          def tip(g): return dt.datetime.fromisoformat(g["tipoff_utc"].replace("Z","+00:00"))
          soon=[g["game_id"] for g in fx.get("games",[]) if 0 < (tip(g)-now).total_seconds() <= 9*3600 and (tip(g)-now).total_seconds() >= 20*60]
          outs=sorted((str(e["team_id"]),str(e["player_id"])) for e in inj.get("injuries",[]) if e.get("source_reported_status")=="OUT")
          h=hashlib.sha256(json.dumps([outs,sorted(soon)]).encode()).hexdigest()[:16]
          state={}
          try: state=json.load(open("docs/nba_v3_latest/state.json"))
          except Exception: pass
          age=9e9
          try: age=(now-dt.datetime.fromisoformat(state["generated_at_utc"].replace("Z","+00:00"))).total_seconds()
          except Exception: pass
          force=os.environ.get("FORCE","false")=="true"
          run = bool(soon) and (force or state.get("hash")!=h or age>3*3600)
          open(os.environ["GITHUB_OUTPUT"],"a").write(f"run={'true' if run else 'false'}\nhash={h}\ngames={len(soon)}\n")
          print("games tipping in 20min-9h:",len(soon),"| hash",h,"| previous",state.get("hash"),"| age s",int(age) if age<9e9 else None,"| run:",run)
          PY
        env:
          FORCE: ${{ github.event.inputs.force }}
      - name: Re-simulate (same model, same checks, empty first-seen archive)
        if: steps.src.outputs.run == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/empty-archive"
          PYTHONPATH=. python -u nba/nba_v3_shadow_publish.py \
            --fixture "$RUNNER_TEMP/fixtures.json" \
            --injury-snapshot "$RUNNER_TEMP/injuries.json" \
            --history-cache .cache/nba-v3-phase1 \
            --archive-root "$RUNNER_TEMP/empty-archive" \
            --draws 8000 --out "$RUNNER_TEMP/latest-new.json"
      - name: Publish the replaceable latest file
        if: steps.src.outputs.run == 'true'
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/latest-new.json" || { echo "no forecast produced"; exit 0; }
          mkdir -p docs/nba_v3_latest
          cp "$RUNNER_TEMP/latest-new.json" docs/nba_v3_latest/latest.json
          python - <<'PY'
          import json,os
          d=json.load(open("docs/nba_v3_latest/latest.json"))
          json.dump({"hash":os.environ["H"],"generated_at_utc":d["generated_at_utc"],"games":[g["game_id"] for g in d["games"]]},open("docs/nba_v3_latest/state.json","w"),indent=1)
          PY
          git config user.name "nba-v3-latest[bot]"
          git config user.email "nba-v3-latest[bot]@users.noreply.github.com"
          git add docs/nba_v3_latest
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "NBA V3 latest run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          echo "push failed"; exit 1
        env:
          H: ${{ steps.src.outputs.hash }}
