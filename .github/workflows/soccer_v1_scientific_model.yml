    paths:
      - src/soccer/**
      - server/soccerResearch.ts
      - server/soccerPlayerResearch.ts
      - server/soccerPlayerBoard.ts
      - src/soccer/espnAutofeed.ts
      - src/soccer/espnPlayerBoard.ts
      - src/soccer/espnBoardAssets.ts
      - scripts/soccerEspnRolling.ts
      - server/soccerEspnBoard.ts
      - tests/soccerEspnAutofeed.test.ts
      - tests/soccerEspnPlayerGrade.test.ts
      - src/soccer/espnPlayerGrade.ts
      - tests/soccerEspnPlayerBoard.test.ts
      - tests/soccerPlayerBoard.test.ts
      - tests/soccerPlayerChallenger.test.ts
      - tests/soccerPlayerResearch.test.ts
      - server/soccerForwardStatus.ts
      - src/soccer/forwardLedger.ts
      - scripts/soccerForwardLedger.ts
      - tests/soccerForwardLedger.test.ts
      - tests/soccerForwardStatus.test.ts
      - src/components/SoccerTodayScreen.tsx
      - src/App.tsx
      - server.ts
      - tests/soccerModel.test.ts
      - tests/soccerResearch.test.ts
      - tests/soccerFrozenBoard.test.ts
      - tests/soccerMatchLabels.test.ts
      - tests/soccerTopRanked.test.ts
      - src/soccer/topRanked.ts
      - src/soccer/matchLabels.ts
      - tests/browser/soccerOfflineBoard.spec.ts
      - src/soccer/frozenBoardAssets.ts
      - src/soccer/frozenBoard.ts
      - .github/workflows/soccer_v1_scientific_model.yml
  pull_request:
    paths:
      - src/soccer/**
      - server/soccerResearch.ts
      - server/soccerPlayerResearch.ts
      - server/soccerPlayerBoard.ts
      - src/soccer/espnAutofeed.ts
      - src/soccer/espnPlayerBoard.ts
      - src/soccer/espnBoardAssets.ts
      - scripts/soccerEspnRolling.ts
      - server/soccerEspnBoard.ts
      - tests/soccerEspnAutofeed.test.ts
      - tests/soccerEspnPlayerGrade.test.ts
      - src/soccer/espnPlayerGrade.ts
      - tests/soccerEspnPlayerBoard.test.ts
      - tests/soccerPlayerBoard.test.ts
      - tests/soccerPlayerChallenger.test.ts
      - tests/soccerPlayerResearch.test.ts
      - server/soccerForwardStatus.ts
      - src/soccer/forwardLedger.ts
      - scripts/soccerForwardLedger.ts
      - tests/soccerForwardLedger.test.ts
      - tests/soccerForwardStatus.test.ts
      - src/components/SoccerTodayScreen.tsx
      - src/App.tsx
      - server.ts
      - tests/soccerModel.test.ts
      - tests/soccerResearch.test.ts
      - tests/soccerFrozenBoard.test.ts
      - tests/soccerMatchLabels.test.ts
      - tests/soccerTopRanked.test.ts
      - src/soccer/topRanked.ts
      - src/soccer/matchLabels.ts
      - tests/browser/soccerOfflineBoard.spec.ts
      - src/soccer/frozenBoardAssets.ts
      - src/soccer/frozenBoard.ts
      - .github/workflows/soccer_v1_scientific_model.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  soccer-science-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile the actual app and server
        run: |
          npm run lint
          npm run build
      - name: Guard leakage, separate research from betting, and preserve existing NFL logic
        run: |
          node --import tsx --test tests/soccerModel.test.ts tests/soccerResearch.test.ts tests/soccerForwardLedger.test.ts tests/soccerForwardStatus.test.ts tests/soccerPlayerChallenger.test.ts tests/soccerPlayerResearch.test.ts tests/soccerFrozenBoard.test.ts tests/soccerMatchLabels.test.ts tests/soccerTopRanked.test.ts tests/soccerPlayerBoard.test.ts tests/soccerEspnAutofeed.test.ts tests/soccerEspnPlayerBoard.test.ts tests/soccerEspnPlayerGrade.test.ts
          npm test
      - name: Real multi-season five-league data source audit and chronological 3-way Brier challenge
        run: |
          node --import tsx --input-type=module - <<'JS'
          import {computeSoccerResearch} from './server/soccerResearch.ts';
          const r=await computeSoccerResearch(new Date(),fetch);
          const d=r.historical_audit;
          console.log('SOCCER_FIVE_LEAGUE_REAL_WALKFORWARD',JSON.stringify({
            n:d.overall.n, model_brier:d.overall.brier,baseline_brier:d.overall.baselineBrier,
            brier_advantage:d.overall.brierAdvantage,by_league:d.byLeague,
            gate:d.promotionGate,goalProjections:d.overall.goalProjections,
            fixtures:r.forecast_count,sources:r.original_source_receipts.length
          }));
          if(r.original_source_receipts.length!==20)throw Error('Missing source receipt');
          if(d.overall.n<500)throw Error('Insufficient historical audit');
          if(d.overall.goalProjections.teamScores!==2*d.overall.n||
             !Number.isFinite(d.overall.goalProjections.meanAbsoluteError)||
             !Number.isFinite(d.overall.goalProjections.baselineMeanAbsoluteError))
            throw Error('Missing actual-goals-vs-original-projections grading');
          if(r.guardrails.official_bets!==0||r.guardrails.verified_live_book_lines!==0)
            throw Error('Unverified wager promoted to official bet');
          if(r.forecasts.some(f=>f.status!=='RESEARCH_UNCALIBRATED_NEVER_OFFICIAL_BET'))
            throw Error('Uncalibrated soccer probability mislabeled');
          JS
      - name: Browser verify soccer archived projections on a 360px mobile screen with API offline
        run: |
          npx playwright install --with-deps chromium
          npx playwright test tests/browser/soccerOfflineBoard.spec.ts
      - run: git diff --check
