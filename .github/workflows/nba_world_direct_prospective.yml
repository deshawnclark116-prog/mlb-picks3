name: NBA WORLD direct distribution prospective freeze
on:
  push:
    branches: [research/nba-world-cleanroom]
    paths:
      - 'nba_world/direct_prospective.py'
      - '.github/workflows/nba_world_direct_prospective.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install 'numpy>=1.26,<2.5' 'scikit-learn>=1.6,<1.9' 'pyarrow>=18,<25'
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -u -m nba_world.fetch_history --years 2023 2024 2025 --out /tmp/nba_world_history
      - run: |
          python -u -m nba_world.direct_prospective \
            --games /tmp/nba_world_history/world_games_2023.jsonl.gz \
            --games /tmp/nba_world_history/world_games_2024.jsonl.gz \
            --games /tmp/nba_world_history/world_games_2025.jsonl.gz \
            --games nba/data/nba_v4_games_2025_26.jsonl.gz \
            --games nba/data/nba_v4_games_2026_27.jsonl \
            --checkpoint /tmp/nba_world_direct.joblib \
            --out /tmp/nba_world_direct_prospective.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-world-direct-prospective-${{ github.run_id }}
          path: |
            /tmp/nba_world_direct.joblib
            /tmp/nba_world_direct_prospective.json
          retention-days: 90
