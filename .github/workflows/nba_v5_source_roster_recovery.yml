name: NBA V5 source roster recovery contracts
on:
  push:
    branches: [main]
    paths:
      - "nba/nba_v3_shadow_publish.py"
      - "nba/nba_v5_backtest.py"
      - "nba/nba_v5_forecast.py"
      - "tests/test_nba_v5_source_roster_recovery.py"
      - "tests/test_nba_v5_cold_start.py"
      - ".github/workflows/nba_v5_source_roster_recovery.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=2.1,<2.5" "scipy>=1.14,<1.18"
      - name: Compile new roster and simulation path
        run: python -m compileall -q nba/nba_v3_shadow_publish.py nba/nba_v5_backtest.py nba/nba_v5_forecast.py
      - name: Roster provenance, no hindsight, and V5 recoveries
        run: |
          python -m unittest -v \
            tests.test_nba_v5_source_roster_recovery \
            tests.test_nba_v3_daily_roster \
            tests.test_nba_v5_cold_start
