name: NBA specialist router — typecheck, contracts, build

on:
  pull_request:
    paths:
      - 'server/nbaSpecialist.ts'
      - 'src/components/NbaSpecialistPanel.tsx'
      - 'src/components/NbaResearchScreen.tsx'
      - 'server.ts'
      - 'tests/nbaSpecialist.test.ts'
      - 'package.json'
      - 'tests/browser/nbaSpecialistPrimary.spec.ts'
      - 'tests/browser/nbaV3Primary.spec.ts'
      - 'tests/browser/nbaV5Share.spec.ts'
      - '.github/workflows/nba_specialist_contract.yml'
  push:
    branches: [main, feat/nba-specialists-primary-20261121]

jobs:
  specialist-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Specialist owner and as-of safety regression
        run: node --import tsx --test tests/nbaSpecialist.test.ts
      - name: Production build with specialist primary
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Real mobile browser verifies official specialist default and previous model
        run: npx playwright test tests/browser/nbaSpecialistPrimary.spec.ts tests/browser/nbaV3Primary.spec.ts tests/browser/nbaV5Share.spec.ts
