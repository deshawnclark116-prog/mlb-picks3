name: NBA original pregame player-game roster audit
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "nba/nba_v3_v4_v5_roster_crosscheck.py"
      - ".github/workflows/nba_v3_v4_v5_roster_crosscheck.yml"
permissions:
  contents: write
concurrency:
  group: nba-original-roster-membership-audit
  cancel-in-progress: false
jobs:
  roster:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate 25-game original roster matchups against ranked players
        run: |
          set -euo pipefail
          python -m nba.nba_v3_v4_v5_roster_crosscheck
      - name: Publish factual roster integrity diagnostics
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nba_v5_grades/v3_v4_v5_roster_integrity.json
          if git diff --cached --quiet; then
            echo "ROSTER_AUDIT_UNCHANGED"
            exit 0
          fi
          git commit -m "Research: verify model top-ten source player-game membership"
          git pull --rebase origin main
          git push origin HEAD:main
