name: NHL real game card identity and unpriced projection integrity
on:
  pull_request:
    paths:
      - src/nhl/gameGrouping.ts
      - src/components/NhlTodayScreen.tsx
      - src/nhl/countResearch.ts
      - tests/nhlRealGameGrouping.test.ts
      - package.json
      - .github/workflows/nhl_real_game_grouping.yml
  push:
    branches: [main]
    paths:
      - src/nhl/gameGrouping.ts
      - src/components/NhlTodayScreen.tsx
      - src/nhl/countResearch.ts
      - tests/nhlRealGameGrouping.test.ts
      - package.json
      - .github/workflows/nhl_real_game_grouping.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test-source-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify only two NHL cards for Buffalo-Philadelphia and Florida-Ottawa
        run: |
          node --import tsx --test tests/nhlRealGameGrouping.test.ts tests/nhlCountResearch.test.ts tests/unifiedSportGameCards.test.ts
      - name: Validate TypeScript frontend and actual production bundle
        run: |
          npm run lint
          npm run build
          git diff --check
