name: Soccer forward first-seen originals and final-goal grading
on:
  schedule:
    - cron: '11 2,14 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - src/soccer/forwardLedger.ts
      - scripts/soccerForwardLedger.ts
      - .github/workflows/soccer_forward_firstseen.yml
permissions:
  contents: write
concurrency:
  group: soccer-original-firstseen-main
  cancel-in-progress: false
jobs:
  firstseen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate historical model and forward no-leak invariants
        run: |
          npm run lint
          node --import tsx --test tests/soccerForwardLedger.test.ts tests/soccerModel.test.ts tests/soccerResearch.test.ts
      - name: Freeze source-verified prior-day match goals and grade only full-time finals
        run: node --import tsx scripts/soccerForwardLedger.ts
      - name: Commit only newly frozen originals, first-seen grades, and summary
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/soccer_forward
          if git diff --cached --quiet; then
            echo 'No new original forecasts or finalized grades'
            exit 0
          fi
          git commit -m 'Soccer: append first-seen forecasts and exact final-goal grades [skip ci]'
          git push origin HEAD:main
