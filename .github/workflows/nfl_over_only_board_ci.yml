name: NFL over-only board regression
on:
  pull_request:
    paths:
      - 'src/nfl/**'
      - 'src/components/ExistingNflProjectionSlate.tsx'
      - 'src/components/NflPrecisionGameShareCard.tsx'
      - 'src/components/NflPrecisionShareModal.tsx'
      - 'tests/nflOverOnlyBoard.test.ts'
      - 'tests/nflOwnProjectionRank.test.ts'
      - 'package.json'
      - '.github/workflows/nfl_over_only_board_ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
