name: NBA V5 unblended projection shadow unit acceptance
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "nba/nba_v5_forecast.py"
      - "tests/test_nba_v5_unblended_research.py"
      - ".github/workflows/nba_v3_latest_refresh.yml"
      - ".github/workflows/nba_v5_unblended_research_tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile research and unchanged production modules
        run: |
          python -m py_compile nba/nba_v5_forecast.py nba/nba_v5_rank.py nba/nba_v5_uncertainty.py
      - name: Install minimal NBA V5 runtime libraries
        run: |
          python -m pip install --disable-pip-version-check "numpy>=2.1,<2.5" "scipy>=1.14,<1.18"
      - name: Verify pure V5 stats, original rounding and champion isolation
        run: |
          python -m unittest discover -s tests -p "test_nba_v5_unblended_research.py" -v
