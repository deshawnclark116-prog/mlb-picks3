name: NBA V5 real published source -> frontend API smoke
on:
  push:
    branches: [main]
    paths:
      - server/nbaV5PublishedSync.ts
      - tests/nbaV5PublishedSync.test.ts
      - src/components/NbaV3ResearchPanel.tsx
      - src/components/NbaResearchScreen.tsx
      - tests/nbaV3Latest.test.ts
      - docs/nba_v5_latest/readiness.json
      - docs/nba_v5_latest/latest.json
      - .github/workflows/nba_v5_real_source_api_smoke.yml
  pull_request:
    paths:
      - server/nbaV5PublishedSync.ts
      - server/nbaV3Shadow.ts
      - server/nbaV3Latest.ts
      - .github/workflows/nba_v5_real_source_api_smoke.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  prove-real:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify CURRENT V5 empirical-game release replaces old numeric projections
        run: |
          node --import tsx --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {loadNbaV3Shadow} from './server/nbaV3Shadow.ts';
          import {createPublishedV5Sync} from './server/nbaV5PublishedSync.ts';
          const asOf=Date.now();
          const original=loadNbaV3Shadow(new Date(asOf));
          const {execFileSync}=await import('node:child_process');
          const checkoutCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          const immutableRoot='https://raw.githubusercontent.com/deshawnclark116-prog/mlb-picks3/'+checkoutCommit;
          const readyResponse=await fetch(immutableRoot+'/docs/nba_v5_latest/readiness.json',{cache:'no-store'});
          assert.equal(readyResponse.status,200);
          const ready=await readyResponse.json();
          const {readFileSync}=await import('node:fs');
          const checkoutReady=JSON.parse(readFileSync('docs/nba_v5_latest/readiness.json','utf8'));
          assert.equal(ready.document_generated_at_utc,checkoutReady.document_generated_at_utc,
            'public release does not match the newly published GitHub checkout');
          assert.equal(ready.schema,'NBA_V5_FORECAST_READINESS_V1');
          const synced=await createPublishedV5Sync()(original,asOf);
          console.log('NBA_V5_LIVE_SOURCE_DIAGNOSTIC',JSON.stringify(synced.v5_published_sync));
          console.log('NBA_V5_LINEUP_BY_GAME',JSON.stringify((synced.games??[]).filter(g=>g.forecast_kind==='V5_LATEST').map(g=>({
            game_id:g.game_id,home:g.home,away:g.away,
            forecast_at:g.forecast_at_utc,
            certified_pregame_team_effect:g.certified_pregame_team_effect,
            top_row_model:g.rows?.[0]?.model_version
          }))));
          assert.equal(synced.v5_published_sync.source_state,'SOURCE_VERIFIED',synced.v5_published_sync.source_error);
          assert.equal(synced.v5_published_sync.latest_generation_at_utc,ready.document_generated_at_utc);
          const currentIds=new Set((ready.games??[]).map(g=>String(g.game_id)));
          const eligible=(ready.games??[]).filter(g=>Date.parse(g.tipoff_utc)>asOf+15*60_000);
          const shared=eligible.filter(g=>original.games.some(x=>String(x.game_id)===String(g.game_id)));
          const fullResponse=await fetch(immutableRoot+'/docs/nba_v5_latest/latest.json',{cache:'no-store'});
          assert.equal(fullResponse.status,200);
          const full=await fullResponse.json();
          const {validateShadowHeader,validateShadowGame}=await import('./server/nbaV3Shadow.ts');
          try{validateShadowHeader(full);console.log('V5_DIAG_HEADER_OK');}
          catch(e){console.log('V5_DIAG_HEADER_REJECT',String(e));}
          for(const g of full.games??[]){
            const old=original.games.find(x=>String(x.game_id)===String(g.game_id));
            let validation='OK';
            try{validateShadowGame(g,new Set());}catch(e){validation=String(e);}
            console.log('V5_DIAG_GAME',JSON.stringify({
              id:g.game_id,exists_in_original:!!old,validate:validation,
              v5_date:g.forecast_at_utc,old_date:old?.forecast_at_utc,
              tip:g.tipoff_utc,same_tip:old?.tipoff_utc===g.tipoff_utc,
              v5_rows:g.rows_count,real_rows:g.rows?.length,model:g.rows?.[0]?.model_version
            }));
          }
          if(shared.length){
            const displayed=synced.games.filter(g=>currentIds.has(String(g.game_id))&&g.forecast_kind==='V5_LATEST');
            assert.ok(displayed.length>0,'current published pretip V5 projections must reach served NBA games');
            if(ready.model_version?.includes('-empirical-game')){
              assert.ok(displayed.some(g=>g.rows.some(r=>r.model_version?.includes('-empirical-game'))),
                'frontend-served model must be empirical-game, not old native V5/V3');
            }
            console.log('NBA_V5_CURRENT_RELEASE_REACHED_API',JSON.stringify({
              model:ready.model_version,shared_games:shared.map(g=>g.game_id),
              v5_displayed:displayed.map(g=>g.game_id),generation:ready.document_generated_at_utc
            }));
          }else{
            console.log('NBA_V5_NO_CURRENT_SHARED_PREGAME_GAMES',JSON.stringify({
              now:new Date(asOf).toISOString(),ready_games:ready.games?.length,
              original_games:original.games.length
            }));
            if(eligible.length)throw Error('NBA_V5_PUBLISHED_GAMES_NOT_PRESENT_ON_FRONTEND_BASE');
          }
          JS
      - name: Boot actual Express/React server and request the NBA frontend endpoint
        run: |
          set -euo pipefail
          (npm run dev > /tmp/prop-edge-smoke-server.log 2>&1 & echo $! >/tmp/prop-edge-smoke-server.pid)
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:3000/ >/dev/null 2>&1; then
              ready=1; break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "APP_DID_NOT_BOOT"; tail -100 /tmp/prop-edge-smoke-server.log; exit 1
          fi
          curl --fail --silent --show-error --max-time 65 \
            "http://127.0.0.1:3000/api/nba-v3-shadow" -o /tmp/prop-edge-nba-v5-api.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('/tmp/prop-edge-nba-v5-api.json','utf8'));
          assert.equal(d.schema,'NBA_V3_FULL_GAME_DISTRIBUTION_READ_ONLY_V1');
          assert.ok(Array.isArray(d.games));
          assert.ok(d.v5_published_sync,'HTTP endpoint must expose V5 public source freshness to frontend');
          assert.equal(d.v5_published_sync.source_state,'SOURCE_VERIFIED',d.v5_published_sync.source_error);
          console.log('NBA_V5_ACTUAL_HTTP_ENDPOINT_DELIVERS_SOURCE_STATUS',JSON.stringify({
            state:d.v5_published_sync.source_state,
            source_gen:d.v5_published_sync.latest_generation_at_utc,
            games:d.games.length,
            error:d.v5_published_sync.source_error
          }));
          JS
      - name: Verify live frontend compile and same-source Top10 selection
        run: |
          npm run lint
          npm run build
          node --import tsx --test tests/nbaV5PublishedSync.test.ts tests/nbaV3Latest.test.ts tests/nbaV5ShareCard.test.ts
