name: NBA V5 frozen first-seen challenger contract
on:
  pull_request:
    paths:
      - "nba/nba_v5_forward_compare.py"
      - "tests/test_nba_v5_forward_compare.py"
      - ".github/workflows/nba_v3_latest_refresh.yml"
      - ".github/workflows/nba_v5_postmortem.yml"
      - ".github/workflows/nba_v5_forward_compare.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  firstseen-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -q "numpy>=2.1,<2.5" "scipy>=1.14,<1.18" "PyYAML>=6,<7"
      - name: NBA V5 all numerical simulator / grading regression tests
        run: python -m unittest discover -s tests -p "test_nba_v5*.py" -v
      - name: Verify workflow syntax and source/candidate isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          def load(p):
              d=yaml.safe_load(Path(p).read_text())
              assert isinstance(d,dict) and 'jobs' in d
              return d
          refresh=load('.github/workflows/nba_v3_latest_refresh.yml')
          grades=load('.github/workflows/nba_v5_postmortem.yml')
          text=Path('.github/workflows/nba_v3_latest_refresh.yml').read_text()
          assert 'v5_lineup_games.json' in text
          assert 'v5_lineup_archive' in text
          assert 'v5_lineup_features.json' in text
          assert 'first' in text
          assert 'docs/nba_v5_latest/features.json' in text
          assert 'continue-on-error: true' in text
          assert 'nba_v5_forward_compare' in Path('.github/workflows/nba_v5_postmortem.yml').read_text()
          assert refresh['jobs']['latest']['timeout-minutes']>=30
          assert grades['jobs']['grade']['timeout-minutes']>=20
          print('FROZEN_FIRSTSEEN_WORKFLOWS_PARSE_OK')
          PY
      - name: Safe zero-pair run before any future challenger is archived
        run: |
          python -m nba.nba_v5_forward_compare \
            --champion-archive docs/nba_v5_archive \
            --challenger-archive docs/nba_v5_lineup_archive \
            --grades docs/nba_v5_grades \
            --out /tmp/nba_v5_forward_empty.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/nba_v5_forward_empty.json'))
          assert not d['model_promotion_allowed']
          assert not d['graded_paired_games']
          print('NO_RETROSPECTIVE_CHALLENGER_FABRICATION')
          PY
