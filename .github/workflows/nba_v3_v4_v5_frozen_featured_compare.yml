name: NBA frozen V3 V4 V5 actual featured card comparison
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "nba/nba_v3_v4_v5_featured_compare.py"
      - ".github/workflows/nba_v3_v4_v5_frozen_featured_compare.yml"

permissions:
  contents: write

concurrency:
  group: nba-frozen-three-version-top-ten-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct actual original V3 V4 V5 cards and verify known benchmarks
        run: |
          set -euo pipefail
          python -m nba.nba_v3_v4_v5_featured_compare
      - name: Publish exhaustive research comparison, not production projections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/nba_v5_grades/v3_v4_v5_frozen_featured_cards_2026-11-08.json \
                  docs/nba_v5_grades/v3_v4_v5_frozen_featured_cards_2026-11-08.md
          if git diff --cached --quiet; then
            echo "COMPARISON_UNCHANGED"
            exit 0
          fi
          git commit -m "Research: verified NBA V3/V4/V5 Nov 8 featured player-target outcomes"
          git pull --rebase origin main
          git push origin HEAD:main
