name: NBA V5 historical shot execution research (shadow only)
on:
  pull_request:
    paths:
      - "nba/nba_v5_shot_style.py"
      - "nba/nba_v5_sim.py"
      - "nba/nba_v5_backtest.py"
      - "tests/test_nba_v5_shot_style.py"
      - ".github/workflows/nba_v5_shot_style.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  shot-style-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy>=2.1,<2.5" "scipy>=1.14,<1.18"
      - name: Preserve original simulator and new style regression contracts
        run: python -m unittest discover -s tests -p "test_nba_v5*.py" -v
      - name: Verify real ESPN descriptive shot-family coverage
        run: |
          python - <<'PY'
          from nba.nba_v5_shot_style import ShotStyleState
          from nba.nba_v5_backtest import load_pbp
          import json
          s=ShotStyleState()
          games=load_pbp(["nba/data/nba_v5_pbp_2025_26.jsonl.gz",
                           "nba/data/nba_v5_pbp_2026_27.jsonl.gz"])
          for pb in games.values(): s.add_game(pb)
          print("NBA_V5_SHOT_STYLE_COVERAGE",json.dumps(s.audit(),sort_keys=True))
          assert s.zone_events>10000
          assert len([v for v in s.raw_families if v>100])>=3
          PY
      - name: Retrospective paired champion versus style challenger
        run: |
          python -u -m nba.nba_v5_backtest \
            --games nba/data/nba_v4_games_2025_26.jsonl.gz \
            --games nba/data/nba_v4_games_2026_27.jsonl \
            --pbp nba/data/nba_v5_pbp_2025_26.jsonl.gz \
            --pbp nba/data/nba_v5_pbp_2026_27.jsonl.gz \
            --test-from 2026-03-01 --sample 70 --sims 500 \
            --style-trial --out /tmp/nba_v5_shot_style.json
      - name: Print precommitted Brier/MAE and forbid automatic promotion
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/nba_v5_shot_style.json'))
          trial=r['paired_style_trial']
          assert trial['model_promotion_allowed'] is False
          print('SHOT_STYLE_EXPERIMENT',trial['experiment'])
          for name,value in trial['metrics'].items():
              if 'brier_fixed_champion_target' in name or name.startswith('minutes|'):
                  print('SHOT_STYLE_PAIRED',name,value)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nba-v5-shot-execution-shadow
          path: /tmp/nba_v5_shot_style.json
          retention-days: 30
