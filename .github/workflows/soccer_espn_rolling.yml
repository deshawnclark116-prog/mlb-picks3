name: Soccer ESPN automatic pregame player forecasts
on:
  workflow_dispatch: {}
  schedule:
    - cron: '29 11,19 * * *'
permissions:
  contents: write
concurrency:
  group: soccer-espn-rolling-player-forecasts
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile and verify pregame source parsing
        run: |
          npx tsc --noEmit
          node --import tsx --test tests/soccerEspnAutofeed.test.ts tests/soccerPlayerChallenger.test.ts
      - name: Update real ESPN match-history and freeze pregame player forecasts
        run: node --import tsx scripts/soccerEspnRolling.ts
      - name: Append history and first-seen originals without changing prior snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/soccer_player_espn
          if git diff --cached --quiet; then echo 'No new soccer data'; exit 0; fi
          git diff --cached --check
          git commit -m 'Soccer: source-verified pregame player forecasts and history [skip ci]'
          git push origin HEAD:main
