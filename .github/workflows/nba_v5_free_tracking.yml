name: NBA V5 free actual player tracking and model opportunity source
on:
  pull_request:
    paths:
      - "nba/nba_v5_hoopr_tracking.py"
      - "nba/nba_v5_tracking_opportunities.py"
      - "nba/nba_v5_forecast.py"
      - "tests/test_nba_v5_hoopr_tracking.py"
      - "tests/test_nba_v5_tracking_opportunities.py"
      - "docs/nba_v5_latest/features.json"
      - ".github/workflows/nba_v3_latest_refresh.yml"
      - ".github/workflows/nba_v5_free_tracking.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  tracking-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -q 'numpy>=2.1,<2.5' 'pandas>=2.2,<3' 'pyarrow>=18,<25' 'scipy>=1.14,<1.18'
      - name: Syntax and source/model regressions
        run: |
          set -euo pipefail
          python -m compileall -q nba/nba_v5_hoopr_tracking.py nba/nba_v5_tracking_opportunities.py nba/nba_v5_forecast.py
          python -m unittest discover -s tests -p "test_nba_v5_hoopr_tracking.py" -v
          python -m unittest discover -s tests -p "test_nba_v5_tracking_opportunities.py" -v
      - name: Verify free player tracking has NOT been promoted
        run: |
          python - <<'PY'
          import json
          x=json.load(open("docs/nba_v5_latest/features.json"))["features"]
          assert x["tracking_opportunity_role"] is False
          print("INCUMBENT_UNCHANGED_FREE_TRACKING_RESEARCH_ONLY")
          PY
      - name: Live real 2025-26 downloaded release smoke, no sample fabrication
        continue-on-error: true
        run: |
          python - <<'PY'
          from nba.nba_v5_hoopr_tracking import download_family
          df,rec=download_family("player_tracking_drives",2025)
          assert len(df)>=100, "Expected real published player rows"
          assert {"player_name","team_abbreviation","gp"}.issubset(set(map(str.lower,df.columns)))
          assert rec["sha256"] and rec["bytes"]>5000
          print("REAL_COMPLETED_SEASON_TRACKING_RELEASE_VERIFIED",
                len(df),rec["url"],rec["sha256"])
          PY
