name: NBA V1 verify ESPN player minutes and box-score data contract
on:
  push:
    branches: [feat/nba-v1-verified-player-minutes-stats-20261018, main]
    paths:
      - nba/nba_v1_player_model.py
      - tests/test_nba_v1_player_model.py
      - .github/workflows/nba_v1_player_source_contract.yml
  pull_request:
    paths:
      - nba/nba_v1_player_model.py
      - tests/test_nba_v1_player_model.py
      - .github/workflows/nba_v1_player_source_contract.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  player-roster-minutes-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Player prop model source contracts and no made-up starters
        run: |
          PYTHONPATH=. python -m unittest -v tests/test_nba_v1_player_model.py
          python -m py_compile nba/nba_v1_player_model.py
      - name: Real ESPN 2025-26 completed NBA box score smoke test
        run: |
          PYTHONPATH=. python - <<'PY'
          import datetime as dt
          from nba.nba_v1_team_model import get_scoreboard,extract_events
          from nba.nba_v1_player_model import fetch_summary,parse_final_boxscore
          d,blob=get_scoreboard(dt.date(2025,10,22))
          games=[x for x in extract_events(blob) if x["completed"]]
          assert games, "Missing real completed Oct 22 NBA scoreboard events"
          successes=[];failures=[]
          for g in games[:4]:
            try:
              players,meta=parse_final_boxscore(fetch_summary(g["game_id"]),
                  g["game_id"],[g["home_id"],g["away_id"]])
              successes.append({"game_id":g["game_id"],
                  "players":len(players),"examples":[{
                    "player":p["player"],"minutes":p["minutes"],
                    "points":p["points"],"rebounds":p["rebounds"],
                    "assists":p["assists"],"threes":p["three_pointers_made"]
                   } for p in players[:2]]})
            except Exception as e:failures.append(str(e))
          print("NBA_REAL_ESPN_PLAYER_BOXSCORE_SOURCE",successes,failures)
          assert successes,"ESPN player source contract not verified: "+str(failures)
          PY
