name: NFL reader-first forecast delivery UI acceptance
on:
  push:
    branches: [fix/nfl-reader-first-verified-projections, fix/nfl-authoritative-github-serving-game-schedule]
  pull_request:
    paths:
      - 'src/components/NflTodayScreen.tsx'
      - 'src/nfl/readable.ts'
      - 'src/nfl/existing.ts'
      - 'src/components/ExistingNflProjectionSlate.tsx'
      - 'server/nflCurrent.ts'
      - 'server.ts'
      - 'tests/nflCurrent.test.ts'
      - 'tests/nflExisting.test.ts'
      - 'src/nfl/existingCardRank.ts'
      - 'src/nfl/verifiedMarkets.ts'
      - 'src/nfl/roleSupportedNfl.ts'
      - 'tests/nflRoleSupported.test.ts'
      - 'tests/nflVerifiedMarkets.test.ts'
      - 'src/components/NflExistingShareModal.tsx'
      - 'src/components/NflExistingShareCard.tsx'
      - 'tests/nflExistingCardRank.test.ts'
      - 'tests/nflReadable.test.ts'
      - 'tests/browser/nflPhase1.spec.ts'
      - '.github/workflows/nfl_reader_first_acceptance.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript static checks and production bundle
        run: |
          npm run lint
          npm run build
      - name: Existing NFL security, probability and delivery regressions
        run: npm test
      - name: Numeric projection clarity and no-fake-pick unit tests
        run: node --import tsx --test tests/nflReadable.test.ts tests/nflExisting.test.ts tests/nflExistingCardRank.test.ts tests/nflVerifiedMarkets.test.ts tests/nflRoleSupported.test.ts tests/nflCurrent.test.ts
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Real 360x800 NFL board and data failure browser acceptance
        env:
          NFL_SCREENSHOT_DIR: ${{ runner.temp }}
        run: npx playwright test tests/browser/nflPhase1.spec.ts --reporter=line
