name: NFL confirmed Week 11 QB-role showcase hold
on:
  pull_request:
    paths:
      - src/nfl/weeklyShowcase.ts
      - tests/nflWeek11QbShowcaseGuard.test.ts
      - .github/workflows/nfl_week11_qb_showcase_hold.yml
  push:
    branches: [fix/nfl-nov22-qb-role-showcase-guard]
permissions:
  contents: read
jobs:
  source-conditioned-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate unchanged NFL source contracts and types
        run: npm run lint
      - name: Test 1pm verified QB-role affected markets and opposing unaffected players
        run: node --import tsx --test tests/nflWeek11QbShowcaseGuard.test.ts
      - name: Production build
        run: npm run build
