name: NBA V5 saved pretip API recovery and no-hindsight tests
on:
  pull_request:
    paths:
      - server/nbaV3Latest.ts
      - tests/nbaV3Latest.test.ts
      - .github/workflows/nba_v5_pretip_api_recovery.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Verify actual NBA V5 game card recovers from source-timed saved pretip forecast
        run: |
          node --import tsx --test tests/nbaV3Latest.test.ts tests/nbaV3ShadowApi.test.ts tests/nbaV3ProjectionPicks.test.ts tests/nbaV5ShareCard.test.ts
      - name: Type check serving and API
        run: npm run lint
