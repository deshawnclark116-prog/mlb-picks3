name: NBA WORLD expanded historical corpus and independent stress test
on:
  push:
    branches: [research/nba-world-cleanroom]
    paths:
      - 'nba_world/fetch_history.py'
      - '.github/workflows/nba_world_expanded.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyarrow>=18,<25'
      - run: python -u -m nba_world.fetch_history --years 2023 2024 2025 --out /tmp/nba_world_history
      - uses: actions/upload-artifact@v4
        with:
          name: verified-older-nba-boxes
          path: |
            /tmp/nba_world_history/world_games_*.jsonl.gz
            /tmp/nba_world_history/manifest.json
  train:
    needs: acquire
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-older-nba-boxes
          path: /tmp/nba_world_history
      - run: |
          pip install 'numpy>=1.26,<2.5' 'scikit-learn>=1.6,<1.9'
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p 'test_nba_world*.py' -v
      - run: |
          python -u -m nba_world.evaluate \
            --games /tmp/nba_world_history/world_games_2023.jsonl.gz \
            --games /tmp/nba_world_history/world_games_2024.jsonl.gz \
            --games /tmp/nba_world_history/world_games_2025.jsonl.gz \
            --games nba/data/nba_v4_games_2025_26.jsonl.gz \
            --games nba/data/nba_v4_games_2026_27.jsonl \
            --archive docs/nba_v5_lineup_archive/first \
            --grades docs/nba_v5_lineup_grades/first \
            --out /tmp/nba_world_expanded.json
      - uses: actions/upload-artifact@v4
        with:
          name: expanded-neural-evaluation
          path: |
            /tmp/nba_world_expanded.json
            /tmp/nba_world_expanded.pt
