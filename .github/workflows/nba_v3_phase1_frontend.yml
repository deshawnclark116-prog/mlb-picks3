name: NBA V3 full-game model board source and UI integrity
on:
  pull_request:
    paths:
      - server/nbaV3Shadow.ts
      - server.ts
      - src/components/NbaV3ResearchPanel.tsx
      - src/components/NbaV5GameShareCard.tsx
      - src/components/NbaV5ShareModal.tsx
      - src/nba/v5ShareCard.ts
      - src/lib/exportImage.ts
      - tests/nbaV5ShareCard.test.ts
      - tests/browser/nbaV5Share.spec.ts
      - src/components/NbaResearchScreen.tsx
      - tests/nbaV3ShadowApi.test.ts
      - tests/browser/nbaV3Primary.spec.ts
      - package.json
      - .github/workflows/nba_v3_phase1_frontend.yml
  push:
    branches: [main]
    paths:
      - server/nbaV3Shadow.ts
      - server.ts
      - src/components/NbaV3ResearchPanel.tsx
      - src/components/NbaV5GameShareCard.tsx
      - src/components/NbaV5ShareModal.tsx
      - src/nba/v5ShareCard.ts
      - src/lib/exportImage.ts
      - tests/nbaV5ShareCard.test.ts
      - tests/browser/nbaV5Share.spec.ts
      - src/components/NbaResearchScreen.tsx
      - tests/nbaV3ShadowApi.test.ts
      - package.json
      - .github/workflows/nba_v3_phase1_frontend.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  no-fake-v3-bets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read full real NBA V3 CDF only from prior immutable shadow; build system board
        run: |
          npm run lint
          node --import tsx --test tests/nbaV3ShadowApi.test.ts tests/nbaDecisionBoard.test.ts tests/nbaProbabilityEngine.test.ts tests/nbaV3ProjectionPicks.test.ts tests/nbaV5ShareCard.test.ts
          npm run build
          git diff --check
      - name: Install headless Chromium for NBA V3 default UI verification
        run: npx playwright install --with-deps chromium
      - name: Browser prove V3 default SYSTEM PICKS, V3 MODEL BOARD and V2 archive not silently substituted
        run: npx playwright test tests/browser/nbaV3Primary.spec.ts tests/browser/nbaV5Share.spec.ts
