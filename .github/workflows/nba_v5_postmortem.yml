name: NBA V5 grade every forecast against the real result

# Grades each ORIGINAL V5 forecast (docs/nba_v5_archive/first) and the last pre-tip version (…/last) once the game is final.
# A graded game is never re-graded. Writes docs/nba_v5_grades/<first|last>/<game>.json and docs/nba_v5_grades/summary.json
# (causes of misses, stated-versus-actual chances for every projection and for the screen's top picks, range coverage, and
# how often each reported injury status matched who actually played).
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nba-v5-postmortem
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=2.1,<2.5"
      - name: Grade finished games
        run: |
          set -euo pipefail
          test -d docs/nba_v5_archive || { echo "nothing archived yet"; exit 0; }
          PYTHONPATH=. python -u -m nba.nba_v5_postmortem --archive docs/nba_v5_archive --grades docs/nba_v5_grades --ledger docs/nba_v5_info/ledger.jsonl
      - name: Grade missed played rotation minutes without hindsight in forecasts
        run: |
          set -euo pipefail
          PYTHONPATH=. python -u -m nba.nba_v5_roster_omission_grade \
            --games nba/data/nba_v4_games_2025_26.jsonl.gz \
            --games nba/data/nba_v4_games_2026_27.jsonl \
            --grades docs/nba_v5_grades/last \
            --archive-last docs/nba_v5_archive/last \
            --out docs/nba_v5_grades/roster_omission_audit.json
      - name: Compare V4 and standalone V5 numerical means against original frozen blend
        run: |
          set -euo pipefail
          PYTHONPATH=. python -u -m nba.nba_v5_frozen_components \
            --archive-last docs/nba_v5_archive/last \
            --grades-last docs/nba_v5_grades/last \
            --out docs/nba_v5_grades/frozen_component_comparison.json
      - name: Attribute original V5 minute and player-stat errors to pretip roster coverage
        run: |
          set -euo pipefail
          PYTHONPATH=. python -u -m nba.nba_v5_rotation_attribution \
            --archive-last docs/nba_v5_archive/last \
            --grades-last docs/nba_v5_grades/last \
            --omissions docs/nba_v5_grades/roster_omission_audit.json \
            --out docs/nba_v5_grades/rotation_attribution.json
      - name: Audit immutable forecast coverage and pending results
        run: |
          PYTHONPATH=. python -u -m nba.nba_v5_grade_health \
            --archive docs/nba_v5_archive --grades docs/nba_v5_grades
      - name: Grade original frozen lineup challenger without changing public champion
        run: |
          set -euo pipefail
          if [ -d docs/nba_v5_lineup_archive/first ]; then
            PYTHONPATH=. python -u -m nba.nba_v5_postmortem \
              --archive docs/nba_v5_lineup_archive \
              --grades docs/nba_v5_lineup_grades \
              --ledger docs/nba_v5_info/ledger.jsonl
          else
            echo "No forward lineup challenger archived yet; original V5 grading unaffected"
          fi
      - name: Compare actual first-seen original player/stat forecasts against lineup challenger
        run: |
          set -euo pipefail
          if [ -d docs/nba_v5_lineup_archive/first ]; then
            PYTHONPATH=. python -u -m nba.nba_v5_forward_compare \
              --champion-archive docs/nba_v5_archive \
              --challenger-archive docs/nba_v5_lineup_archive \
              --grades docs/nba_v5_grades \
              --out docs/nba_v5_forward/lineup_challenger_latest.json
          fi
      - name: Publish grades
        run: |
          set -euo pipefail
          git config user.name "nba-v5-postmortem[bot]"
          git config user.email "nba-v5-postmortem[bot]@users.noreply.github.com"
          git add -A docs/nba_v5_grades
          for optional in docs/nba_v5_lineup_grades docs/nba_v5_forward; do
            if [ -d "$optional" ]; then git add -A "$optional"; fi
          done
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "NBA V5 grades $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep 5; done
          echo "push failed"; exit 1
