name: NBA V5 grade every forecast against the real result

# Grades each ORIGINAL V5 forecast (docs/nba_v5_archive/first) and the last pre-tip version (…/last) once the game is final.
# A graded game is never re-graded. Writes docs/nba_v5_grades/<first|last>/<game>.json and docs/nba_v5_grades/summary.json
# (causes of misses, stated-versus-actual chances for every projection and for the screen's top picks, range coverage, and
# how often each reported injury status matched who actually played).
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: nba-v5-postmortem
  cancel-in-progress: false
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=2.1,<2.5"
      - name: Grade finished games
        run: |
          set -euo pipefail
          test -d docs/nba_v5_archive || { echo "nothing archived yet"; exit 0; }
          PYTHONPATH=. python -u -m nba.nba_v5_postmortem --archive docs/nba_v5_archive --grades docs/nba_v5_grades --ledger docs/nba_v5_info/ledger.jsonl
      - name: Audit immutable forecast coverage and pending results
        run: |
          PYTHONPATH=. python -u -m nba.nba_v5_grade_health \
            --archive docs/nba_v5_archive --grades docs/nba_v5_grades
      - name: Publish grades
        run: |
          set -euo pipefail
          git config user.name "nba-v5-postmortem[bot]"
          git config user.email "nba-v5-postmortem[bot]@users.noreply.github.com"
          git add -A docs/nba_v5_grades || true
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "NBA V5 grades $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0; sleep 5; done
          echo "push failed"; exit 1
