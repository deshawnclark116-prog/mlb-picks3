name: Verify model-projection frontend integration
on:
  push:
    branches: [feature/unified-model-projection-delivery]
  pull_request:
    paths:
      - 'server/projectionFeeds.ts'
      - 'src/components/SportProjectionScreen.tsx'
      - 'src/App.tsx'
      - 'server.ts'
      - 'tests/projectionFeeds.test.ts'
      - '.github/workflows/model_projection_frontend.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type-check and build actual React frontend
        run: |
          npm run lint
          npm run build
      - name: Existing NFL source-verified frontend tests
        run: npm test
      - name: Adversarial CFB/NHL model projection contract tests
        run: node --import tsx --test tests/projectionFeeds.test.ts
      - name: Verify both published original-source research feeds over HTTP
        run: |
          node --import tsx --input-type=module -e '
          import {loadProjectionFeed} from "./server/projectionFeeds.ts";
          for (const sport of ["cfb","nhl"]) {
            const feed=await loadProjectionFeed(sport);
            const count=sport==="cfb"?feed.forecast_count:feed.total_valid_forecasts;
            if (!Number.isInteger(count)||count<=0) throw Error(sport+" feed empty");
            console.log(sport+" ORIGINAL-SOURCE VERIFIED RESEARCH rows="+count);
          }
          '
      - name: Install Chromium for 360px actual React browser acceptance
        run: npx playwright install chromium
      - name: Mobile browser tests for actual CFB/NHL projection screens
        run: npx playwright test tests/browser/modelProjections.spec.ts --reporter=line
