name: NHL V2 source-authentic no-book shot milestone probabilities
on:
  pull_request:
    paths:
      - server/nhlCountResearch.ts
      - src/nhl/countResearch.ts
      - src/components/NhlTodayScreen.tsx
      - tests/nhlCountResearch.test.ts
      - .github/workflows/nhl_shot_milestone_probability_research.yml
  push:
    branches: [main]
    paths:
      - server/nhlCountResearch.ts
      - src/nhl/countResearch.ts
      - src/components/NhlTodayScreen.tsx
      - tests/nhlCountResearch.test.ts
      - .github/workflows/nhl_shot_milestone_probability_research.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  locked-distribution-probability-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify authentic SOG mean plus 3+ shot source-CDF probability and no false bet/calibration
        run: |
          npm run lint
          node --import tsx --test tests/nhlCountResearch.test.ts tests/nhlRealGameGrouping.test.ts
          npm run build
          git diff --check
