name: NBA live injury safeguards
on:
  pull_request:
    paths:
      - server/nbaLiveAvailability.ts
      - server/nbaSystemPicks.ts
      - src/components/NbaSystemPicksPanel.tsx
      - docs/nba_verified_game_absences.json
      - tests/nbaLiveAvailability.test.ts
      - tests/nbaDecisionBoard.test.ts
      - package.json
      - .github/workflows/nba_live_injury_gate.yml
  push:
    branches: [main]
    paths:
      - server/nbaLiveAvailability.ts
      - server/nbaSystemPicks.ts
      - src/components/NbaSystemPicksPanel.tsx
      - docs/nba_verified_game_absences.json
      - tests/nbaLiveAvailability.test.ts
      - tests/nbaDecisionBoard.test.ts
      - package.json
      - .github/workflows/nba_live_injury_gate.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  never-serve-injured-model-picks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test live injury, newly injured Flagg, backfill before ranking, and outage fail-closed
        run: |
          npm run lint
          node --import tsx --test tests/nbaLiveAvailability.test.ts tests/nbaDecisionBoard.test.ts
          npm run build
          git diff --check
