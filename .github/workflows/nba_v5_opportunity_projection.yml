name: NBA V5 opportunity projection math
on:
  push:
    branches: [main]
    paths:
      - "nba/nba_v5_sim.py"
      - "tests/test_nba_v5_opportunity_projection.py"
      - ".github/workflows/nba_v5_opportunity_projection.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "numpy>=2.1,<2.5" "scipy>=1.14,<1.18"
      - name: V5 opportunity math and complete-game invariants
        run: |
          python -m compileall -q nba/nba_v5_sim.py
          python -m unittest -v tests.test_nba_v5_opportunity_projection tests.test_nba_v5
