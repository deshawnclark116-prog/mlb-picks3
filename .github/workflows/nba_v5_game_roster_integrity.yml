name: NBA V5 game roster integrity (targeted contract)

on:
  pull_request:
    paths:
      - "nba/nba_v5_forecast.py"
      - "nba/nba_v5_backtest.py"
      - "tests/test_nba_v5_source_roster_recovery.py"
      - ".github/workflows/nba_v5_game_roster_integrity.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  roster-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install forecast test dependencies
        run: python -m pip install "numpy>=2.1,<2.5" "scipy>=1.14,<1.18"
      - name: Compile game forecast boundary
        run: python -m py_compile nba/nba_v5_forecast.py nba/nba_v5_backtest.py
      - name: Verify source roster and cross-team invariants
        run: python -m unittest discover -s tests -p "test_nba_v5_source_roster_recovery.py" -v
