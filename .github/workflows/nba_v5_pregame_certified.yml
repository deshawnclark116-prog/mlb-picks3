name: NBA V5 certified pregame lineup and minutes contract
on:
  pull_request:
    paths:
      - "nba/nba_v5_pregame_certified.py"
      - "nba/nba_v5_forecast.py"
      - "nba/nba_v5_todays_lineups.py"
      - "nba/nba_v5_daily_lineups_feed.py"
      - "tests/test_nba_v5_pregame_certified.py"
      - "tests/test_nba_v5_todays_lineups.py"
      - "tests/test_nba_v5_daily_lineups_feed.py"
      - ".github/workflows/nba_v5_pregame_certified.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  certified-pregame:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulation dependencies
        run: python -m pip install -q "numpy>=2.1,<2.5" "scipy>=1.14,<1.18" "pandas>=2.2,<3.0" "pyarrow>=18,<25"
      - name: Validate source and integration syntax
        run: |
          python -m py_compile nba/nba_v5_pregame_certified.py nba/nba_v5_forecast.py
          python -m unittest discover -s tests -p "test_nba_v5_pregame_certified.py" -v
      - name: Today's Lineups authorized capture adapter tests
        run: python -m unittest discover -s tests -p "test_nba_v5_todays_lineups.py" -v
      - name: Official NBA daily JSON positional-confirmation and no-lookahead tests
        run: python -m unittest discover -s tests -p "test_nba_v5_daily_lineups_feed.py" -v
      - name: Existing core numerical game regressions
        run: python -m unittest discover -s tests -p "test_nba_v5*.py" -v
