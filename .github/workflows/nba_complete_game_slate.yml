name: NBA show all verified games even when zero picks qualify
on:
  pull_request:
    paths:
      - src/nba/boardVisibility.ts
      - src/components/NbaSystemPicksPanel.tsx
      - tests/nbaGameVisibility.test.ts
      - package.json
      - .github/workflows/nba_complete_game_slate.yml
  push:
    branches: [main]
    paths:
      - src/nba/boardVisibility.ts
      - src/components/NbaSystemPicksPanel.tsx
      - tests/nbaGameVisibility.test.ts
      - package.json
      - .github/workflows/nba_complete_game_slate.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  all-seven-authentic-games-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Test exact Oct25 seven-game archive, empty selections, timezone, injury, probability integrity
        run: |
          npm run lint
          node --import tsx --test tests/nbaGameVisibility.test.ts tests/nbaDecisionBoard.test.ts tests/nbaProbabilityEngine.test.ts tests/nbaLiveAvailability.test.ts
          npm run build
          git diff --check
