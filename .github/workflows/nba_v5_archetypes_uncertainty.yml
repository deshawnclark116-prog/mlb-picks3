name: NBA V5 opportunity and uncertainty contracts
on:
  pull_request:
    paths:
      - "nba/nba_v5_archetypes.py"
      - "nba/nba_v5_uncertainty.py"
      - "nba/nba_v5_forecast.py"
      - "nba/nba_v5_postmortem.py"
      - "tests/test_nba_v5_archetypes_uncertainty.py"
      - ".github/workflows/nba_v5_archetypes_uncertainty.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  nba-archetype-uncertainty-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q "numpy>=2.1,<2.5" "scipy>=1.14,<1.18" "pdfplumber>=0.11,<0.13"
      - name: All NBA V5 original contracts and new role/uncertainty tests
        run: python -m unittest discover -s tests -p "test_nba_v5*.py" -v
      - name: Validate no newly invented tracking inputs and unchanged model switches
        run: |
          python - <<'PY'
          import json
          from nba.nba_v5_archetypes import player_archetype
          from nba.nba_v5_uncertainty import forecast_uncertainty
          d=json.load(open('docs/nba_v5_latest/features.json'))
          assert d['features']['lineup_pairs'] is False
          assert d['features']['shot_style'] is False
          assert player_archetype([], '2026-11-06')['model_effect']=='SHADOW_ONLY'
          x=forecast_uncertainty([10,11,15,20]*20,[20,30,30,35]*20,.8)
          moments=x['unconditional_zero_if_DNP_mixture']
          assert abs(moments['variance_total']-moments['variance_availability']-moments['variance_conditional_playing'])<.0001
          print('ARHCETYPES_DIAGNOSTIC_ONLY_AND_VARIANCE_CONSERVED')
          PY
