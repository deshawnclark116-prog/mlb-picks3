name: NBA WORLD clean-room joint game model
on:
  push:
    branches: [research/nba-world-cleanroom]
    paths:
      - 'nba_world/data.py'
      - 'nba_world/model.py'
      - 'nba_world/evaluate.py'
      - 'nba_world/reconcile.py'
      - 'docs/nba_world/verified_grade_corrections.json'
      - 'tests/test_nba_world.py'
      - '.github/workflows/nba_world.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install 'numpy>=1.26,<2.5'
          pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s tests -p test_nba_world.py -v
      - run: |
          python -u -m nba_world.evaluate \
            --games nba/data/nba_v4_games_2025_26.jsonl.gz \
            --games nba/data/nba_v4_games_2026_27.jsonl \
            --archive docs/nba_v5_lineup_archive/first \
            --grades docs/nba_v5_lineup_grades/first \
            --out /tmp/nba_world_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: nba-world-cleanroom-report
          path: |
            /tmp/nba_world_report.json
            /tmp/nba_world_report.pt
