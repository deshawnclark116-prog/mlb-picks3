name: Soccer ESPN source-contract discovery
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/soccerEspnProbe.ts
      - .github/workflows/soccer_espn_provider_probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --experimental-strip-types scripts/soccerEspnProbe.ts
