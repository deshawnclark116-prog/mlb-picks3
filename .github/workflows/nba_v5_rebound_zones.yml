name: NBA V5 observed miss zone to rebounder shadow
on:
  pull_request:
    paths:
      - "nba/nba_v5_rebound_zones.py"
      - "nba/nba_v5_sim.py"
      - "nba/nba_v5_backtest.py"
      - "tests/test_nba_v5_rebound_zones.py"
      - ".github/workflows/nba_v5_rebound_zones.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  rebound-zone-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install -q "numpy>=2.1,<2.5" "scipy>=1.14,<1.18"
      - name: Full NBA V5 regression and new rebound source invariants
        run: python -m unittest discover -s tests -p "test_nba_v5*.py" -v
      - name: Count only truly observed miss-to-named-rebound pairs
        run: |
          python - <<'PY'
          import json
          from nba.nba_v5_lineup_pairs import LineupPairState
          from nba.nba_v5_rebound_zones import ReboundZoneState
          from nba.nba_v5_backtest import load_pbp
          allpb=load_pbp(["nba/data/nba_v5_pbp_2025_26.jsonl.gz",
                          "nba/data/nba_v5_pbp_2026_27.jsonl.gz"])
          lp=LineupPairState()
          rz=ReboundZoneState()
          for pb in allpb.values():
              if lp.add_game(pb):
                  rz.add_valid_game(pb)
          a=rz.audit()
          print("NBA_V5_NAMED_REBOUND_SOURCE_AUDIT",json.dumps(a,sort_keys=True))
          assert a["valid_lineup_games"]>1000
          assert a["linked_named_rebounds"]>30000
          assert a["covered_teams"]==30
          PY
      - name: Paired champion vs rebound-zone shadow at original numerical target
        run: |
          PYTHONHASHSEED=1 python -u -m nba.nba_v5_backtest \
            --games nba/data/nba_v4_games_2025_26.jsonl.gz \
            --games nba/data/nba_v4_games_2026_27.jsonl \
            --pbp nba/data/nba_v5_pbp_2025_26.jsonl.gz \
            --pbp nba/data/nba_v5_pbp_2026_27.jsonl.gz \
            --test-from 2026-03-01 --sample 70 --sims 500 \
            --rebound-zone-trial --out /tmp/nba_v5_rebound_zone.json
      - name: Print research results and prohibit automatic promotion
        run: |
          python - <<'PY'
          import json
          r=json.load(open("/tmp/nba_v5_rebound_zone.json"))
          p=r["paired_rebound_zone_trial"]
          assert p["model_promotion_allowed"] is False
          for name,metric in p["metrics"].items():
              if name.endswith("brier_fixed_champion_target") or name=="minutes|simulation|mae":
                  print("NBA_REBOUND_ZONE_PAIRED",name,json.dumps(metric,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nba-v5-missed-shot-zone-research
          path: /tmp/nba_v5_rebound_zone.json
          retention-days: 30
